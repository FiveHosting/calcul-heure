<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supprimer mon compte — Calcul d'Heures</title>
  <style>body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:640px;margin:0 auto;padding:32px 20px;background:#0b1220;color:#f8fafc;line-height:1.6}.card{padding:20px;border:1px solid #2b3d5b;border-radius:16px;background:#141f32}button{width:100%;padding:14px;border:0;border-radius:10px;background:#e11d48;color:#fff;font-weight:800;font-size:16px;cursor:pointer}a{color:#37bdf8}#status{min-height:24px;margin-top:14px;color:#cbd5e1}</style>
</head>
<body>
  <h1>Supprimer mon compte</h1>
  <div class="card">
    <p>Cette action efface le compte, les créneaux de travail et les trajets kilométriques associés. Elle est définitive.</p>
    <p>Connectez-vous d’abord à <a href="/">Calcul d'Heures</a> avec le compte à supprimer, puis revenez sur cette page.</p>
    <button id="delete">Supprimer définitivement mon compte</button>
    <p id="status" role="status"></p>
  </div>
  <script>
    document.getElementById('delete').addEventListener('click', async () => {
      if (!confirm('Supprimer définitivement votre compte et toutes ses données ?')) return;
      const status = document.getElementById('status');
      status.textContent = 'Suppression en cours…';
      try {
        const response = await fetch('/api/auth/me', { method: 'DELETE', credentials: 'include' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Suppression impossible.');
        status.textContent = 'Votre compte et ses données ont été supprimés.';
        document.getElementById('delete').disabled = true;
      } catch (error) {
        status.textContent = error.message === 'Authentification requise' ? 'Connectez-vous au compte concerné, puis réessayez.' : error.message;
      }
    });
  </script>
</body>
</html>
